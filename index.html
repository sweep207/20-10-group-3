<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Gửi các bạn nữ Nhóm 3 💖</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
        <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div id="stage">
      <div class="line l1" id="l1"></div>
      <div class="line l2" id="l2"></div>
      <div id="hint">✦ Có một thông điệp đang bay lạc... ✦</div>
      <button id="btn">Giải mã 💌</button>
    </div>

    <div id="card">
      <div class="box">
        <span class="badge">20 · 10 &nbsp;Ngày Phụ nữ Việt Nam</span>
        <div class="big">💖</div>
        <p class="t1">Gửi riêng cho</p>
        <h1 class="t2" id="name"></h1>
        <div class="orn">❀ ❤ ❀</div>
        <div id="msg"></div>
        <div class="wishes" id="wishes"></div>
        <div class="quote" id="quote"></div>
        <div class="sign" id="sign"></div>
        <section id="community-wishes"><h2>Lời chúc từ mọi người 💌</h2><p>Lời chúc sẽ được duyệt trước khi công khai.</p><form id="wish-form"><input id="wish-name" maxlength="60" placeholder="Tên của bạn" required><textarea id="wish-message" maxlength="1000" placeholder="Viết lời chúc 20/10..." required></textarea><button class="b2" type="submit">Gửi lời chúc 🌷</button></form><p id="wish-status" aria-live="polite"></p><div id="wish-list"></div></section>
        <div class="btns" id="btns">
          <small>nhấn phím Space để thả thêm tim ♡</small>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="script.js" defer></script>
    </body>
</html>
